name: Lineaje AI Policy Scan

on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install mcp httpx

      - name: Run Lineaje AI policy scan
        env:
          LINEAJE_PAT_TOKEN: ${{ secrets.LINEAJE_PAT_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          MCP_TLS_INSECURE_SKIP_VERIFY: "1"
        run: |
          python .github/scripts/scm_unifai_scan.py \
            --source-path . \
            --repo ${{ github.repository }} \
            --branch ${{ github.ref_name }} \
            --head-sha ${{ github.sha }} \
            --exclude .git \
            --mcp-server-url https://localhost/mcp \
            --create-fix-pr
